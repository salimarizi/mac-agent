<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Mac Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --status-h: 48px;
      --toolbar-h: 64px;
      --accent: #6C5CE7;
      --accent-glow: rgba(108, 92, 231, 0.35);
      --accent-light: #A29BFE;
      --bg: #000;
      --surface: rgba(18, 18, 24, 0.82);
      --surface-elevated: rgba(32, 32, 44, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.16);
      --text: #F0F0F5;
      --text-secondary: rgba(240, 240, 245, 0.45);
      --danger: #FF6B6B;
      --success: #51CF66;
      --warn: #FFD43B;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: contain;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Status Bar ── */
    #statusBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      height: var(--status-h);
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
      z-index: 10;
    }

    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    #dot.connecting {
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px rgba(81, 207, 102, 0.5);
      animation: none;
    }
    #dot.error {
      background: var(--danger);
      box-shadow: 0 0 8px rgba(255, 107, 107, 0.4);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.85); }
    }

    #statusText {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    /* ── Status-bar chip ── */
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .chip:active { background: rgba(255,255,255,0.1); }
    .chip.active { color: var(--accent-light); border-color: var(--accent); }

    /* ── Video area ── */
    #videoWrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: none;
      background: radial-gradient(ellipse at center, #0a0a14 0%, #000 100%);
    }

    #screen {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      /* Centre origin: clampPan and the double-tap zoom both compute offsets
         from the middle of the viewport. */
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* ── Placeholder ── */
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }
    #placeholder .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #placeholder .icon-wrap svg { opacity: 0.4; }
    #placeholder p {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 240px;
      line-height: 1.6;
    }

    /* ── Remote cursor ── */
    #cursor {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      display: none;
      transition: left 0.03s linear, top 0.03s linear;
    }
    #cursor.visible { display: block; }
    #cursorArrow { width: 16px; height: 22px; position: relative; }
    #cursorArrow svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
    #cursorRipple {
      position: absolute;
      top: 0; left: 0;
      width: 30px; height: 30px;
      border: 2px solid var(--accent-light);
      border-radius: 50%;
      transform: translate(-7px, -4px) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    #cursorRipple.tap { animation: ripple 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes ripple {
      0%   { transform: translate(-7px, -4px) scale(0); opacity: 1; }
      100% { transform: translate(-7px, -4px) scale(1.8); opacity: 0; }
    }

    /* Held-down marker so a touch drag is visibly distinct from a hover. */
    #cursor.dragging #cursorRipple {
      animation: none;
      transform: translate(-7px, -4px) scale(1);
      opacity: 1;
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: var(--toolbar-h);
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
      padding: 0 4px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tbBtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1 1 0;
      min-width: 0;
      min-height: 48px;
      padding: 0 2px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.25s, background 0.25s;
    }
    .tbBtn span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tbBtn:active { background: rgba(255,255,255,0.06); }
    .tbBtn svg {
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tbBtn:active svg { transform: scale(0.9); }
    .tbBtn.active {
      color: var(--accent-light);
    }
    .tbBtn.active svg {
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    /* ── Connect overlay ── */
    #connectOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(30px) saturate(1.2);
      -webkit-backdrop-filter: blur(30px) saturate(1.2);
      z-index: 20;
      padding: 32px;
    }

    .overlay-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 36px 28px 32px;
      background: var(--surface-elevated);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.05) inset;
    }

    .overlay-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    #connectOverlay h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #connectOverlay .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
      margin-top: -12px;
    }

    #hostInput, #passwordInput {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    #hostInput:focus, #passwordInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(108, 92, 231, 0.06);
    }
    #hostInput::placeholder, #passwordInput::placeholder { color: var(--text-secondary); font-weight: 400; }

    #connectBtn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 24px var(--accent-glow);
    }
    #connectBtn:active { transform: scale(0.97); }
    #connectBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #errorMsg {
      font-size: 13px;
      font-weight: 500;
      color: var(--danger);
      text-align: center;
      min-height: 18px;
    }

    /* ── Keyboard hint ── */
    #kbHint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-elevated);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    #kbHint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #kbCapture {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px; height: 1px;
      top: 50%; left: 50%;
    }

    /* ── Accessory key bar ── */
    #keyBar {
      display: none;
      flex-shrink: 0;
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-top: 1px solid var(--glass-border);
      padding: 6px 4px;
      z-index: 10;
    }
    #keyBar.visible { display: block; }

    .keyBarScroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 4px;
      touch-action: pan-x;
    }
    .keyBarScroll::-webkit-scrollbar { display: none; }

    .kbKey {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .kbKey:active { background: rgba(255,255,255,0.1); }
    .kbKey.held {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
    }

    .kbDismiss {
      margin-left: auto;
      background: rgba(255,107,107,0.12);
      border-color: rgba(255,107,107,0.2);
      color: var(--danger);
    }

    .kbSep {
      width: 1px;
      height: 24px;
      background: var(--glass-border);
      flex-shrink: 0;
      align-self: center;
    }

    /* ── Bottom sheet (shortcuts, clipboard, options) ── */
    #sheetScrim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 30;
    }
    #sheetScrim.open { opacity: 1; pointer-events: auto; }

    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 78vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--surface);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-top: 1px solid var(--glass-border);
      border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 31;
      touch-action: pan-y;
    }
    #sheet.open { transform: translateY(0); }

    .sheetGrip {
      width: 40px; height: 4px;
      border-radius: 2px;
      background: var(--glass-border-hover);
      margin: 2px auto 14px;
    }
    .sheetTitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 14px 2px 8px;
    }
    .sheetGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }
    .sheetBtn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      min-height: 52px;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sheetBtn:active { background: rgba(255,255,255,0.1); }
    .sheetBtn .combo {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .sheetBtn.active {
      border-color: var(--accent);
      color: var(--accent-light);
    }

    /* ── Stats HUD ── */
    #hud {
      position: absolute;
      top: 8px; right: 8px;
      display: none;
      flex-direction: column;
      gap: 1px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
      font-size: 10.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      pointer-events: none;
      z-index: 6;
    }
    #hud.visible { display: flex; }
    #hud b { color: var(--text); font-weight: 600; }

    /* ── Keyboard-open state: shrink video ── */
    #app.kb-open #videoWrap {
      transition: flex 0.25s ease;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="statusBar">
    <div id="dot"></div>
    <span id="statusText">Not connected</span>
    <button class="chip" id="btnQuality" aria-label="Stream quality">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20v-5M10 20V9M16 20v-8M22 20V4"/>
      </svg>
      <span id="qualityLabel">Auto</span>
    </button>
  </div>

  <div id="videoWrap">
    <video id="screen" autoplay playsinline muted></video>
    <div id="cursor">
      <div id="cursorArrow">
        <svg width="16" height="22" viewBox="0 0 16 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L1 18.5L5.5 14L9.5 21L12 19.5L8 13L14 12L1 1Z" fill="white" stroke="black" stroke-width="1.2"/>
        </svg>
      </div>
      <div id="cursorRipple"></div>
    </div>

    <div id="placeholder">
      <div class="icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <p>Connect to start controlling your Mac</p>
    </div>

    <div id="connectOverlay">
      <div class="overlay-card">
        <div class="overlay-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <h1>Mac Remote</h1>
        <p class="subtitle">Enter your Mac's address and password</p>
        <input id="hostInput" type="text" placeholder="192.168.1.x:8443" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="connectBtn">Connect</button>
        <span id="errorMsg"></span>
      </div>
    </div>

    <div id="hud"></div>
    <div id="kbHint">Keyboard active</div>
  </div>

  <!-- Accessory key bar (arrows, Esc, Tab, modifiers) — shown when mobile keyboard is open -->
  <div id="keyBar">
    <div class="keyBarScroll">
      <button class="kbKey" data-key="escape">Esc</button>
      <button class="kbKey" data-key="tab">Tab</button>
      <button class="kbKey kbMod" data-mod="cmd">Cmd</button>
      <button class="kbKey kbMod" data-mod="ctrl">Ctrl</button>
      <button class="kbKey kbMod" data-mod="alt">Opt</button>
      <button class="kbKey kbMod" data-mod="shift">Shift</button>
      <span class="kbSep"></span>
      <button class="kbKey" data-key="left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="kbKey" data-key="down">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="kbKey" data-key="up">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <button class="kbKey" data-key="right">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <span class="kbSep"></span>
      <button class="kbKey" data-act="paste">Paste</button>
      <button class="kbKey" data-act="copy">Copy</button>
      <span class="kbSep"></span>
      <button class="kbKey" data-key="delete">Del</button>
      <button class="kbKey" data-key="home">Home</button>
      <button class="kbKey" data-key="end">End</button>
      <button class="kbKey kbDismiss" id="kbDismissBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
      </button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tbBtn" id="btnKb" aria-label="Toggle keyboard">

<div id="sheet">
