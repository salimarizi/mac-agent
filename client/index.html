<textarea id="kbCapture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────
const state = {
  ws: null,
  pc: null,
  dc: null,
  connected: false,
  scrollMode: false,
  nextRightClick: false,
  // 'touch'   — the picture behaves like a touchscreen: you act where you tap.
  // 'trackpad' — the original relative-cursor behaviour, kept for precision work.
  inputMode: 'touch',
  // 'auto' follows orientation; an explicit choice sticks across rotations.
  fitMode: 'auto',
  quality: 'auto',
  // Cleared the moment the user picks a preset themselves.
  autoAdapt: true,
  showStats: false,
  // Reconnect supervision: wantConnected stays true until the user explicitly
  // disconnects, so a dropped Wi-Fi/cellular link retries on its own.
  wantConnected: false,
  host: null,
  password: null,
  retryAttempt: 0,
  retryTimer: null,
  stallTimer: null,
  streamRestarts: 0,
};

const RETRY_BASE_MS = 800;
const RETRY_MAX_MS = 15000;

// Stall detection. WebRTC happily reports "connected" while the picture is
// frozen — a dead encoder, a black-holed relay — so decoded frames, not the
// connection state, are what tell us the stream is actually alive.
const STALL_CHECK_MS = 2000;
const STALL_MS = 6000;
// After this many in-place restarts the pipeline is not the problem; drop the
// socket and rebuild everything instead of asking for offer after offer.
const MAX_STREAM_RESTARTS = 3;

// ── Zoom / pan state ──────────────────────────────────────────────────────────
const zoom = {
  scale: 1,
  panX: 0,
  panY: 0,
  startDist: 0,
  startScale: 1,
  pinching: false,
  // The scale applyFit last chose, so a later resize can tell a preset apart
  // from a pinch the user made themselves.
  fitScale: 1,
};
const ZOOM_MIN = 1;
const ZOOM_MAX = 5;

function applyZoom() {
  screenEl.style.transform = zoom.scale === 1
    ? ''
    : `translate(${zoom.panX}px, ${zoom.panY}px) scale(${zoom.scale})`;
  updateCursorDisplay();
}

// pictureRect returns the size of the letterboxed picture inside the (untransformed)
// video element, which is what the pan limits and the fill scale are measured against.
function pictureRect() {
  const w = videoWrap.getBoundingClientRect();
  const vw = screenEl.videoWidth;
  const vh = screenEl.videoHeight;
  if (!vw || !vh || !w.width || !w.height) {
    return { wrapW: w.width, wrapH: w.height, picW: w.width, picH: w.height };
  }
  const base = Math.min(w.width / vw, w.height / vh);
  return { wrapW: w.width, wrapH: w.height, picW: vw * base, picH: vh * base };
}

function clampPan() {
  if (zoom.scale <= 1) { zoom.panX = 0; zoom.panY = 0; return; }
  const { wrapW, wrapH, picW, picH } = pictureRect();
  // Clamp against the picture, not the element, so the letterbox bars can never
  // be panned into view.
  const maxPanX = Math.max(0, (picW * zoom.scale - wrapW) / 2);
  const maxPanY = Math.max(0, (picH * zoom.scale - wrapH) / 2);
  zoom.panX = Math.max(-maxPanX, Math.min(maxPanX, zoom.panX));
  zoom.panY = Math.max(-maxPanY, Math.min(maxPanY, zoom.panY));
}

function resetZoom() {
  zoom.scale = 1;
  zoom.panX = 0;
  zoom.panY = 0;
  applyZoom();
}

function fingerDist(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.hypot(dx, dy);
}

function isZoomed() { return zoom.scale > 1.05; }

// ── Fit / fill ────────────────────────────────────────────────────────────────
// "Fit" shows the whole Mac screen (letterboxed). On a phone held upright that
// leaves a strip too small to read, so "fill" scales the picture to cover the
// viewport and lets you pan across it.
const FIT_KEY = 'macagent_fit';

function isPortrait() {
  return window.innerHeight > window.innerWidth;
}

function effectiveFit() {
  if (state.fitMode === 'fit' || state.fitMode === 'fill') return state.fitMode;
  return (isTouchDevice && isPortrait()) ? 'fill' : 'fit';
}

function fillScale() {
  const { wrapW, wrapH, picW, picH } = pictureRect();
  if (!picW || !picH) return 1;
  const s = Math.max(wrapW / picW, wrapH / picH);
  return Math.min(ZOOM_MAX, Math.max(1, s));
}

// videoReady reports whether the stream's own dimensions are known yet. Until
// they are, the fill scale cannot be computed — pictureRect falls back to the
// viewport, which yields a scale of exactly 1 and a picture that stays
// letterboxed while the button claims to be filling.
function videoReady() {
  return !!(screenEl.videoWidth && screenEl.videoHeight);
}

let fitRetry = null;
let fitRetriesLeft = 0;
function retryFitSoon() {
  clearTimeout(fitRetry);
  if (fitRetriesLeft <= 0) return;
  fitRetry = setTimeout(() => {
    fitRetriesLeft--;
    if (videoReady()) applyFit(false);
    else if (state.connected) retryFitSoon();
  }, 250);
}

// preserveZoom keeps a pinch the user already made when the viewport merely
// changes size (rotation, soft keyboard) instead of snapping back to the preset.
function applyFit(preserveZoom) {
  const mode = effectiveFit();
  if (mode === 'fill' && !videoReady()) {
    // Come back once the first frame has told us how big the screen is.
    retryFitSoon();
  }
  if (mode === 'fill') {
    const s = fillScale();
    const userZoomed = preserveZoom && Math.abs(zoom.scale - zoom.fitScale) > 0.01;
    if (!userZoomed) zoom.scale = s;
    zoom.fitScale = s;
    if (!preserveZoom) { zoom.panX = 0; zoom.panY = 0; }
  } else {
    zoom.fitScale = 1;
    if (!preserveZoom) { zoom.scale = 1; zoom.panX = 0; zoom.panY = 0; }
  }
  clampPan();
  applyZoom();
  fitLabel.textContent = mode === 'fill' ? 'Fill' : 'Fit';
  btnFit.classList.toggle('active', mode === 'fill');
}

// ── Remote cursor tracking ────────────────────────────────────────────────────
const remoteCursor = { x: 0.5, y: 0.5 };

function updateCursorDisplay() {
  const r = screenEl.getBoundingClientRect();
  const w = videoWrap.getBoundingClientRect();
  const vw = screenEl.videoWidth  || r.width;
  const vh = screenEl.videoHeight || r.height;
  if (!vw || !vh) return;
  const scale = Math.min(r.width / vw, r.height / vh);
  const rw = vw * scale;
  const rh = vh * scale;
  // r is the transformed rect, so zoom and pan are already baked in; offset it
  // back into the wrapper the cursor is positioned against.
  const ox = (r.left - w.left) + (r.width  - rw) / 2;
  const oy = (r.top  - w.top)  + (r.height - rh) / 2;
  cursor.style.left = (ox + remoteCursor.x * rw) + 'px';
  cursor.style.top  = (oy + remoteCursor.y * rh) + 'px';
}

function moveCursorRel(dx, dy) {
  const vw = screenEl.videoWidth  || 1600;
  const vh = screenEl.videoHeight || 900;
  remoteCursor.x = Math.max(0, Math.min(1, remoteCursor.x + dx / vw));
  remoteCursor.y = Math.max(0, Math.min(1, remoteCursor.y + dy / vh));
  updateCursorDisplay();
}

function moveCursorAbs(x, y) {
  remoteCursor.x = x;
  remoteCursor.y = y;
  updateCursorDisplay();
}

function showCursorRipple() {
  const ripple = document.getElementById('cursorRipple');
  ripple.classList.remove('tap');
  void ripple.offsetWidth;
  ripple.classList.add('tap');
}

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const dot         = $('dot');
const statusText  = $('statusText');
// Named screenEl, not screen: the latter shadows window.screen and with it the
// orientation API.
const screenEl    = $('screen');
const placeholder = $('placeholder');
const overlay     = $('connectOverlay');
const hostInput   = $('hostInput');
const passwordInput = $('passwordInput');
const connectBtn  = $('connectBtn');
const errorMsg    = $('errorMsg');
const videoWrap   = $('videoWrap');
const cursor      = $('cursor');
const kbHint      = $('kbHint');
const kbCapture   = $('kbCapture');
const btnQuality  = $('btnQuality');
const qualityLabel = $('qualityLabel');
const btnKb       = $('btnKb');
const btnMode     = $('btnMode');
const btnFit      = $('btnFit');
const modeLabel   = $('modeLabel');
const fitLabel    = $('fitLabel');
const btnScroll   = $('btnScroll');
const btnFullscreen = $('btnFullscreen');
const btnDisconnect = $('btnDisconnect');

const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ICE servers received from the server after auth (includes TURN credentials).
let serverICE = [{ urls: 'stun:stun.l.google.com:19302' }];

// ── Stream quality ───────────────────────────────────────────────────────────
// The phone knows what the Mac cannot: whether it is on cellular, and whether
// the user wants detail or smoothness right now. "Auto" sends empty values, which
// the agent reads as "use the settings you were started with".
const QUALITY_KEY = 'macagent_quality';
const HUD_KEY = 'macagent_hud';
const QUALITY_PRESETS = [
  { id: 'auto',   label: 'Auto',   payload: {} },
  { id: 'sharp',  label: 'Sharp',  payload: { width: 1600, fps: 30, bitrate: '6M' } },
  { id: 'smooth', label: 'Smooth', payload: { width: 1280, fps: 30, bitrate: '3M' } },
  { id: 'saver',  label: 'Saver',  payload: { width: 960,  fps: 20, bitrate: '1200K' } },
];

function currentQuality() {
  return QUALITY_PRESETS.find(q => q.id === state.quality) || QUALITY_PRESETS[0];
}

// A phone is not a desktop on the same LAN: the agent's own defaults are tuned
// for a big screen, and pushing 6 Mbps at a handset over cellular mostly buys
// queueing delay, which is felt as lag rather than seen as detail.
function defaultQualityForDevice() {
  if (!isTouchDevice) return 'auto';
  const c = navigator.connection;
  if (c && (c.saveData || /^(slow-)?2g$|^3g$/.test(c.effectiveType || ''))) return 'saver';
  return 'smooth';
}

// Falling back is automatic; climbing back up is not. A link that just proved it
// cannot hold a bitrate will not be talked into it again mid-session, and an
// auto-upgrade would only restart the stream to rediscover that.
function stepDownQuality() {
  const next = { auto: 'smooth', sharp: 'smooth', smooth: 'saver' }[state.quality];
  if (!next) return false;
  state.quality = next;           // not persisted: this is the network, not a preference
  updateQualityChip();
  sendQuality();
  showToast(`Weak connection — dropping to ${currentQuality().label}`, 3000);
  return true;
}

function sendQuality() {
  wsSend('quality', currentQuality().payload);
}

function updateQualityChip() {
  const q = currentQuality();
  qualityLabel.textContent = q.label;
  btnQuality.classList.toggle('active', q.id !== 'auto');
}

// ── Saved interaction preferences ────────────────────────────────────────────
const MODE_KEY = 'macagent_input_mode';
{
  const savedMode = localStorage.getItem(MODE_KEY);
  if (savedMode === 'touch' || savedMode === 'trackpad') state.inputMode = savedMode;
  const savedFit = localStorage.getItem(FIT_KEY);
  if (savedFit === 'fit' || savedFit === 'fill') state.fitMode = savedFit;
  const savedQuality = localStorage.getItem(QUALITY_KEY);
  if (QUALITY_PRESETS.some(q => q.id === savedQuality)) {
    state.quality = savedQuality;
    state.autoAdapt = false;      // an explicit choice is not ours to override
  } else {
    state.quality = defaultQualityForDevice();
  }
  updateQualityChip();
  state.showStats = localStorage.getItem(HUD_KEY) === '1';
  modeLabel.textContent = state.inputMode === 'touch' ? 'Touch' : 'Pad';
  btnMode.classList.toggle('active', state.inputMode === 'touch');
  fitLabel.textContent = effectiveFit() === 'fill' ? 'Fill' : 'Fit';
  btnFit.classList.toggle('active', effectiveFit() === 'fill');
}

// ── Persist last host (password stays in sessionStorage only) ────────────────
const selfHost = (window.location.hostname && window.location.hostname !== 'localhost')
  ? window.location.host
  : null;
if (selfHost) {
  hostInput.value = selfHost;
  const savedPw = sessionStorage.getItem('macagent_pw');
  if (savedPw) {
    passwordInput.value = savedPw;
    window.addEventListener('load', () => connect(selfHost, savedPw), { once: true });
  }
} else {
  const savedHost = localStorage.getItem('macagent_host');
  if (savedHost) hostInput.value = savedHost;
  const savedPw = sessionStorage.getItem('macagent_pw');
  if (savedPw) passwordInput.value = savedPw;
}

// ── Status helpers ────────────────────────────────────────────────────────────
function setStatus(label, cls) {
  statusText.textContent = label;
  dot.className = cls || '';
}

function showError(msg) {
  errorMsg.textContent = msg;
}

const TOUCH_HINT_KEY = 'macagent_touch_hint';
function maybeShowTouchHint() {
  if (!isTouchDevice || state.inputMode !== 'touch') return;
  if (localStorage.getItem(TOUCH_HINT_KEY)) return;
  localStorage.setItem(TOUCH_HINT_KEY, '1');
  showToast(effectiveFit() === 'fill'
    ? 'Tap to click · hold then drag · Fit shows it all'
    : 'Tap to click · hold then drag · swipe to scroll', 4500);
}

let toastTimer = null;
function showToast(text, ms = 2000) {
  kbHint.textContent = text;
  kbHint.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => kbHint.classList.remove('show'), ms);
}

// ── Signaling helpers ─────────────────────────────────────────────────────────
function wsSend(type, payload) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  const msg = payload !== undefined ? { type, payload } : { type };
  state.ws.send(JSON.stringify(msg));
}

// ── Input helpers ─────────────────────────────────────────────────────────────
function dcSend(obj) {
  if (state.dc && state.dc.readyState === 'open') {
    state.dc.send(JSON.stringify(obj));
  }
}

// ── Connect ───────────────────────────────────────────────────────────────────
function cancelRetry() {
  if (state.retryTimer) {
    clearTimeout(state.retryTimer);
    state.retryTimer = null;
  }
}

function scheduleReconnect(reason) {
  if (!state.wantConnected || state.retryTimer) return;
  const delay = Math.min(RETRY_BASE_MS * 2 ** state.retryAttempt, RETRY_MAX_MS);
  state.retryAttempt++;
  setStatus(`Reconnecting in ${Math.round(delay / 100) / 10}s\u2026`, 'connecting');
  if (reason) showError(reason);
  state.retryTimer = setTimeout(() => {
    state.retryTimer = null;
    if (state.wantConnected) connect(state.host, state.password, true);
  }, delay);
}

// ── Stream stats ─────────────────────────────────────────────────────────────
// Derived from the watchdog's getStats poll, so the HUD costs nothing extra.
const statsPrev = { bytes: 0, at: 0, lost: 0, recv: 0, loss: null };

function resetStats() {
  statsPrev.bytes = 0;
  statsPrev.at = 0;
  statsPrev.lost = 0;
  statsPrev.recv = 0;
  statsPrev.loss = null;
  adapt.bad = 0;
}

// lossSince returns the packet loss over the last poll, or null until there is a
// second sample to compare against. Cumulative totals would hide a link that has
// only just started struggling.
function lossSince(inbound) {
  if (!inbound || typeof inbound.packetsReceived !== 'number') return null;
  const lost = inbound.packetsLost || 0;
  const recv = inbound.packetsReceived;
  const dLost = Math.max(0, lost - statsPrev.lost);
  const dRecv = Math.max(0, recv - statsPrev.recv);
  const had = statsPrev.recv > 0;
  statsPrev.lost = lost;
  statsPrev.recv = recv;
  if (!had || dLost + dRecv === 0) return null;
  return dLost / (dLost + dRecv);
}

function transportKind(report) {
  let pair = null;
  report.forEach(s => {
    if (s.type === 'candidate-pair' && (s.nominated || s.state === 'succeeded') && !pair) pair = s;
  });
  if (!pair) return null;
  const typeOf = id => {
    let t = null;
    report.forEach(s => { if (s.id === id) t = s.candidateType; });
    return t;
  };
  const local = typeOf(pair.localCandidateId);
  const remote = typeOf(pair.remoteCandidateId);
  // A relayed pair means the media is bouncing through TURN on the VPS rather
  // than going phone-to-Mac, which costs a round trip in each direction.
  if (local === 'relay' || remote === 'relay') return 'relay';
  if (local === 'host' && remote === 'host') return 'direct';
  return 'p2p';
}

function buildStats(inbound, rtt, loss, transport) {
  const out = {};
  if (inbound) {
    if (inbound.frameWidth) out.size = `${inbound.frameWidth}×${inbound.frameHeight}`;
    if (typeof inbound.framesPerSecond === 'number') out.fps = Math.round(inbound.framesPerSecond);
    if (typeof inbound.bytesReceived === 'number') {
      const now = performance.now();
      const dt = now - statsPrev.at;
      // Too short a gap turns rounding noise into an absurd rate.
      if (statsPrev.at && dt > 200) {
        const kbps = (inbound.bytesReceived - statsPrev.bytes) * 8 / dt;
        if (kbps >= 0) out.rate = `${Math.round(kbps)} kbps`;
      }
      if (!statsPrev.at || dt > 200) {
        statsPrev.bytes = inbound.bytesReceived;
        statsPrev.at = now;
      }
    }
  }
  if (rtt !== null && rtt !== undefined) out.ping = `${Math.round(rtt * 1000)} ms`;
  if (loss !== null) out.loss = `${(loss * 100).toFixed(1)}%`;
  if (transport) out.path = transport;
  out.quality = currentQuality().label + (state.autoAdapt ? '' : ' (set)');
  out.view = `${effectiveFit()} ×${zoom.scale.toFixed(2)}`;
  return out;
}

// ── Adapting to a weak link ──────────────────────────────────────────────────
// Sustained loss means the encoder is sending more than the path can carry, and
// the queue it builds is exactly what is felt as lag. One confident step down
// beats a dozen twitchy ones, so it takes several bad polls in a row.
const adapt = { bad: 0 };
const LOSS_BAD = 0.03;
const BAD_POLLS = 3;

function maybeAdapt(loss) {
  if (!state.autoAdapt || loss === null) return;
  if (loss > LOSS_BAD) {
    if (++adapt.bad >= BAD_POLLS) {
      adapt.bad = 0;
      stepDownQuality();
    }
  } else if (adapt.bad > 0) {
    adapt.bad--;
  }
}

// ── Stall watchdog ───────────────────────────────────────────────────────────
function stopStallWatch() {
  if (state.stallTimer) {
    clearInterval(state.stallTimer);
    state.stallTimer = null;
  }
}

function startStallWatch(pc) {
  stopStallWatch();
  let lastFrames = -1;
  let lastProgress = Date.now();

  state.stallTimer = setInterval(async () => {
    if (state.pc !== pc) { stopStallWatch(); return; }
    // A backgrounded tab stops decoding by design, and iOS throttles our timer
    // on top of that — neither is a stall.
    if (!state.connected || document.visibilityState !== 'visible') {
      lastProgress = Date.now();
      return;
    }

    let frames = null;
    let inbound = null;
    let rtt = null;
    let transport = null;
    try {
      const report = await pc.getStats();
      report.forEach(s => {
        if (s.type === 'inbound-rtp' && s.kind === 'video' && typeof s.framesDecoded === 'number') {
          frames = s.framesDecoded;
          inbound = s;
        } else if (s.type === 'candidate-pair' && s.nominated && typeof s.currentRoundTripTime === 'number') {
          rtt = s.currentRoundTripTime;
        }
      });
      transport = transportKind(report);
    } catch { return; }
    if (frames === null) return;

    const loss = lossSince(inbound);
    if (state.showStats) renderHud(buildStats(inbound, rtt, loss, transport));
    maybeAdapt(loss);

    if (frames !== lastFrames) {
      lastFrames = frames;
      lastProgress = Date.now();
      state.streamRestarts = 0;
      return;
    }
    if (Date.now() - lastProgress > STALL_MS) {
      restartStream('Video stalled — restarting the stream.');
    }
  }, STALL_CHECK_MS);
}

// restartStream asks the agent for a fresh offer over the socket we already have
// authenticated. Rebuilding just the media path recovers from an encoder death in
// about a second, where a full reconnect costs a handshake and a backoff wait.
function restartStream(reason) {
  stopStallWatch();
  if (state.pc) { try { state.pc.close(); } catch {} state.pc = null; }
  state.dc = null;
  state.connected = false;
  screenEl.srcObject = null;
  cursor.classList.remove('visible');
  cursor.classList.remove('dragging');
  touch.dragging = false;
  placeholder.style.display = 'flex';
  if (reason) showError(reason);

  const socketUsable = state.ws && state.ws.readyState === WebSocket.OPEN;
  if (socketUsable && state.streamRestarts < MAX_STREAM_RESTARTS) {
    state.streamRestarts++;
    setStatus('Restarting stream…', 'connecting');
    wsSend('hello');
    return;
  }
  state.streamRestarts = 0;
  if (state.ws) {
    try { state.ws.close(); } catch {}   // onclose schedules the reconnect
  } else {
    scheduleReconnect(reason);
  }
}

// Coming back to the foreground (phone unlocked, tab reselected) is the moment a
// stale socket gets discovered, so retry straight away rather than waiting out a
// backoff the user never saw.
function reconnectNow() {
  if (!state.wantConnected) return;
  if (state.connected) {
    // Still connected, but iOS pauses the element when the tab goes away.
    screenEl.play().catch(() => {});
    return;
  }
  cancelRetry();
  state.retryAttempt = 0;
  connect(state.host, state.password, true);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') reconnectNow();
});
window.addEventListener('online', reconnectNow);

// Closing the tab or backgrounding the browser must hand the viewer slot back,
// otherwise the agent holds the session until its ping timeout expires.
window.addEventListener('pagehide', () => {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    try { state.ws.close(1000, 'client closed'); } catch {}
  }
});

async function connect(host, password, isRetry) {
  teardownPeer();
  cancelRetry();
  showError('');
  state.wantConnected = true;
  state.host = host;
  state.password = password;
  if (!isRetry) state.retryAttempt = 0;
  setStatus('Connecting\u2026', 'connecting');
  connectBtn.disabled = true;

  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const wsURL = `${proto}://${host}/ws`;

  let ws;
  try {
    ws = new WebSocket(wsURL);
  } catch (e) {
    setStatus('Not connected', 'error');
    showError('Invalid address.');
    connectBtn.disabled = false;
    return;
  }
  state.ws = ws;

  ws.onopen = () => {
    setStatus('Authenticating\u2026', 'connecting');
    wsSend('auth', password || '');
  };

  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    switch (msg.type) {
      case 'auth_ok':
        if (msg.payload?.iceServers) {
          serverICE = msg.payload.iceServers;
        }
        setStatus('Handshaking\u2026', 'connecting');
        // Record the preset before asking for a stream, so the first session is
        // already built with it rather than restarted a moment later.
        sendQuality();
        wsSend('hello');
        break;
      case 'auth_fail':
        // A wrong password will never fix itself; stop retrying.
        state.wantConnected = false;
        cancelRetry();
        showError(msg.payload?.message || 'Authentication failed');
        setStatus('Auth failed', 'error');
        connectBtn.disabled = false;
        sessionStorage.removeItem('macagent_pw');
        ws.close();
        return;
      case 'session_ended':
        // The agent released the capture pipeline (encoder died, display
        // changed). The socket is still good, so just ask for a new offer.
        if (state.wantConnected) restartStream(msg.payload?.message || 'Stream ended, restarting.');
        break;
      case 'evicted':
        // Another device took the session; retrying would fight it for the slot.
        state.wantConnected = false;
        cancelRetry();
        showError('Session taken over by another device.');
        setStatus('Disconnected', 'error');
        connectBtn.disabled = false;
        ws.close();
        return;
      case 'offer':
        await handleOffer(msg.payload);
        break;
      case 'candidate':
        if (state.pc && msg.payload) {
          try { await state.pc.addIceCandidate(msg.payload); } catch {}
        }
        break;
      case 'error':
        showError(msg.payload?.message || 'Server error');
        setStatus('Error', 'error');
        break;
    }
  };

  // onerror always precedes onclose, so leave the retry decision to onclose.
  ws.onerror = () => {
    connectBtn.disabled = false;
  };

  ws.onclose = () => {
    if (state.ws === ws) state.ws = null;
    state.connected = false;
    stopStallWatch();
    connectBtn.disabled = false;
    overlay.style.display = 'flex';
    placeholder.style.display = 'flex';
    cursor.classList.remove('visible');

    if (state.wantConnected) {
      scheduleReconnect(`Lost connection to ${host}.`);
    } else {
      setStatus('Not connected', '');
    }
  };
}

// Browsers hold a jitter buffer sized for watching video — a few hundred
// milliseconds of smoothing that, when you are driving a cursor, is just lag.
// Both properties are best-effort and ignored where unsupported.
function minimiseBuffering(pc) {
  for (const r of pc.getReceivers()) {
    if (r.track && r.track.kind !== 'video') continue;
    try { r.jitterBufferTarget = 0; } catch {}
    try { r.playoutDelayHint = 0; } catch {}
  }
}

async function handleOffer(offer) {
  // A re-offer (stream restart) must not leave the previous peer connection
  // running — it would keep an ICE agent and a decoder alive for nothing.
  stopStallWatch();
  if (state.pc) { try { state.pc.close(); } catch {} }

  const pc = new RTCPeerConnection({ iceServers: serverICE });
  state.pc = pc;

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) wsSend('candidate', candidate.toJSON());
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') {
      state.connected = true;
      state.retryAttempt = 0;
      setStatus('Connected', 'connected');
      overlay.style.display = 'none';
      placeholder.style.display = 'none';
      cursor.classList.add('visible');
      hud.classList.toggle('visible', state.showStats);
      resetStats();
      fitRetriesLeft = 40;   // ~10s of grace for the first frame to arrive
      applyFit(false);
      updateCursorDisplay();
      startStallWatch(pc);
      maybeShowTouchHint();
    } else if (s === 'disconnected') {
      // Transient on mobile — the ICE agent usually recovers without help, so
      // keep the video element and the session alive and just say so.
      state.connected = false;
      setStatus('Reconnecting…', 'connecting');
    } else if (s === 'failed' || s === 'closed') {
      state.connected = false;
      stopStallWatch();
      overlay.style.display = 'flex';
      placeholder.style.display = 'flex';
      cursor.classList.remove('visible');
      if (state.wantConnected) {
        // ICE is unrecoverable; drop the socket so the supervisor rebuilds the
        // whole session from a fresh offer.
        if (state.ws) { try { state.ws.close(); } catch {} }
        else scheduleReconnect('Media connection failed.');
      } else {
        setStatus('Disconnected', 'error');
      }
    }
  };

  pc.ondatachannel = ({ channel }) => {
    if (channel.label !== 'input') return;
    state.dc = channel;
    channel.onmessage = ({ data }) => {
      try {
        const msg = JSON.parse(data);
        if (msg.t === 'cursor') {
          moveCursorAbs(msg.x, msg.y);
        } else if (msg.t === 'clip') {
          receiveClip(msg.text);
        }
      } catch {}
    };
  };

  pc.ontrack = ({ streams }) => {
    screenEl.srcObject = streams[0];
    minimiseBuffering(pc);
    // Safari leaves the element paused when a stream is attached outside a user
    // gesture, which looks exactly like a frozen connection.
    screenEl.play().catch(() => {});
  };

  await pc.setRemoteDescription(offer);
  minimiseBuffering(pc);   // receivers exist from here; ontrack repeats it
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  wsSend('answer', answer);
}

// teardownPeer drops the current peer/socket without giving up on reconnecting.
function teardownPeer() {
  stopStallWatch();
  state.streamRestarts = 0;
  if (state.pc) { state.pc.close(); state.pc = null; }
  if (state.ws) {
    state.ws.onclose = null;
    state.ws.close();
    state.ws = null;
  }
  state.dc = null;
  state.connected = false;
  screenEl.srcObject = null;
  // Losing the channel mid-drag would otherwise leave the button latched down.
  touch.dragging = false;
  cursor.classList.remove('dragging');
}

// disconnect is the user asking to stop; it also stops the retry loop.
function disconnect() {
  state.wantConnected = false;
  cancelRetry();
  teardownPeer();
}

// ── Mouse input (desktop) ─────────────────────────────────────────────────────
function videoToNorm(clientX, clientY) {
  const r = screenEl.getBoundingClientRect();
  const vw = screenEl.videoWidth  || r.width;
  const vh = screenEl.videoHeight || r.height;
  const scale = Math.min(r.width / vw, r.height / vh);
  const rw = vw * scale;
  const rh = vh * scale;
  const ox = r.left + (r.width  - rw) / 2;
  const oy = r.top  + (r.height - rh) / 2;
  const x = (clientX - ox) / rw;
  const y = (clientY - oy) / rh;
  return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
}

videoWrap.addEventListener('mousemove', e => {
  if (!state.connected) return;
  const { x, y } = videoToNorm(e.clientX, e.clientY);
  dcSend({ t: 'moveabs', x, y });
  moveCursorAbs(x, y);
});

videoWrap.addEventListener('mousedown', e => {
  if (!state.connected) return;
  e.preventDefault();
  const btn = e.button === 2 ? 'right' : e.button === 1 ? 'center' : 'left';
  dcSend({ t: 'down', button: btn });
});

videoWrap.addEventListener('mouseup', e => {
  if (!state.connected) return;
  const btn = e.button === 2 ? 'right' : e.button === 1 ? 'center' : 'left';
  dcSend({ t: 'up', button: btn });
});

videoWrap.addEventListener('click', e => {
  if (!state.connected) return;
  const { x, y } = videoToNorm(e.clientX, e.clientY);
  dcSend({ t: 'moveabs', x, y });
  const btn = e.button === 2 ? 'right' : 'left';
  dcSend({ t: 'click', button: btn });
});

videoWrap.addEventListener('dblclick', e => {
  if (!state.connected) return;
  const { x, y } = videoToNorm(e.clientX, e.clientY);
  dcSend({ t: 'moveabs', x, y });
  dcSend({ t: 'dblclick', button: 'left' });
});

videoWrap.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!state.connected) return;
  const { x, y } = videoToNorm(e.clientX, e.clientY);
  dcSend({ t: 'moveabs', x, y });
  dcSend({ t: 'click', button: 'right' });
});

videoWrap.addEventListener('wheel', e => {
  if (!state.connected) return;
  e.preventDefault();
  const dx = Math.round(e.deltaX / 20);
  const dy = -Math.round(e.deltaY / 20);
  if (dx !== 0 || dy !== 0) dcSend({ t: 'scroll', dx, dy });
}, { passive: false });

// ── Scroll engine (accumulation + momentum) ──────────────────────────────────
const scroller = {
  accX: 0, accY: 0,
  velX: 0, velY: 0,
  lastTime: 0,
  rafId: null,
  THRESHOLD: 3,
  FRICTION: 0.94,
  MIN_VEL: 0.2,
};

function scrollFeed(dx, dy) {
  scroller.accX += dx;
  scroller.accY += dy;
  const now = performance.now();
  const dt = now - scroller.lastTime || 16;
  scroller.lastTime = now;
  const alpha = Math.min(1, dt / 80);
  scroller.velX = scroller.velX * (1 - alpha) + (dx / dt * 16) * alpha;
  scroller.velY = scroller.velY * (1 - alpha) + (dy / dt * 16) * alpha;
  scrollFlush();
}

function scrollFlush() {
  const sx = Math.trunc(scroller.accX / scroller.THRESHOLD);
  const sy = Math.trunc(scroller.accY / scroller.THRESHOLD);
  if (sx !== 0) scroller.accX -= sx * scroller.THRESHOLD;
  if (sy !== 0) scroller.accY -= sy * scroller.THRESHOLD;
  if (sx !== 0 || sy !== 0) dcSend({ t: 'scroll', dx: sx, dy: sy });
}

function scrollMomentumStart() {
  scrollMomentumStop();
  if (Math.abs(scroller.velX) < scroller.MIN_VEL &&
      Math.abs(scroller.velY) < scroller.MIN_VEL) return;
  function tick() {
    scroller.velX *= scroller.FRICTION;
    scroller.velY *= scroller.FRICTION;
    if (Math.abs(scroller.velX) < scroller.MIN_VEL &&
        Math.abs(scroller.velY) < scroller.MIN_VEL) {
      scroller.velX = scroller.velY = scroller.accX = scroller.accY = 0;
      return;
    }
    scroller.accX += scroller.velX;
    scroller.accY += scroller.velY;
    scrollFlush();
    scroller.rafId = requestAnimationFrame(tick);
  }
  scroller.rafId = requestAnimationFrame(tick);
}

function scrollMomentumStop() {
  if (scroller.rafId) { cancelAnimationFrame(scroller.rafId); scroller.rafId = null; }
}

function scrollReset() {
  scrollMomentumStop();
  scroller.accX = scroller.accY = scroller.velX = scroller.velY = 0;
}

// ── Touch input (mobile / iPhone) ─────────────────────────────────────────────
// Two interaction models share these handlers:
//
//   touch mode    tap clicks the point you tapped, hold-then-drag drags, hold-
//                 then-release opens the context menu, swipe scrolls.
//   trackpad mode the original relative model: the finger pushes the cursor,
//                 a tap clicks wherever the cursor ended up.
const touch = {
  startX: 0, startY: 0,
  lastX: 0,  lastY: 0,
  startTime: 0,
  moved: false,
  longPressTimer: null,
  longPressed: false,
  dragging: false,
  didScroll: false,
  scrollPrimed: false,
  lastSend: 0,
  lastTapTime: 0,
  lastTapX: 0, lastTapY: 0,
};

const LONG_PRESS_MS   = 500;
const TAP_MAX_MOVE    = 10;
const DTAP_INTERVAL   = 300;
const DTAP_MAX_MOVE   = 30;
const DRAG_START_MOVE = 8;
// robotgo runs input on a single goroutine behind a bounded queue, so a drag
// sends about one position per frame instead of every touchmove the browser emits.
const DRAG_SEND_MS    = 16;

function sendMoveAbs(p) {
  dcSend({ t: 'moveabs', x: p.x, y: p.y });
  moveCursorAbs(p.x, p.y);
}

function startDrag() {
  sendMoveAbs(videoToNorm(touch.startX, touch.startY));
  dcSend({ t: 'down', button: 'left' });
  touch.dragging = true;
  cursor.classList.add('dragging');
  navigator.vibrate?.(15);
}

function dragTo(clientX, clientY) {
  const now = performance.now();
  if (now - touch.lastSend < DRAG_SEND_MS) return;
  touch.lastSend = now;
  sendMoveAbs(videoToNorm(clientX, clientY));
}

function endDrag(clientX, clientY) {
  if (!touch.dragging) return;
  if (clientX !== undefined) sendMoveAbs(videoToNorm(clientX, clientY));
  dcSend({ t: 'up', button: 'left' });
  touch.dragging = false;
  cursor.classList.remove('dragging');
}

function onLongPress() {
  if (touch.moved) return;
  touch.longPressed = true;
  navigator.vibrate?.(30);
  if (state.inputMode !== 'touch') {
    // Trackpad mode right-clicks straight away, at wherever the cursor sits.
    dcSend({ t: 'click', button: 'right' });
    showCursorRipple();
  }
  // Touch mode waits: moving from here starts a drag, releasing right-clicks.
}

videoWrap.addEventListener('touchstart', e => {
  if (!state.connected) return;
  e.preventDefault();
  clearTimeout(touch.longPressTimer);
  scrollMomentumStop();

  if (e.touches.length === 1) {
    const t = e.touches[0];
    touch.startX = touch.lastX = t.clientX;
    touch.startY = touch.lastY = t.clientY;
    touch.startTime = Date.now();
    touch.moved = false;
    touch.longPressed = false;
    touch.didScroll = false;
    touch.scrollPrimed = false;
    touch.longPressTimer = setTimeout(onLongPress, LONG_PRESS_MS);
  }

  if (e.touches.length === 2) {
    clearTimeout(touch.longPressTimer);
    endDrag();   // a second finger ends a drag rather than confusing it
    scrollReset();
    touch.startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    touch.startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    touch.lastX  = touch.startX;
    touch.lastY  = touch.startY;
    touch.moved  = false;
    touch.longPressed = false;
    touch.didScroll = false;
    touch.scrollPrimed = false;
    zoom.startDist  = fingerDist(e.touches);
    zoom.startScale = zoom.scale;
    zoom.pinching   = false;
  }
}, { passive: false });

videoWrap.addEventListener('touchmove', e => {
  if (!state.connected) return;
  e.preventDefault();

  if (e.touches.length === 2) {
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const curDist = fingerDist(e.touches);
    const distRatio = curDist / (zoom.startDist || curDist);
    if (Math.abs(distRatio - 1) > 0.08) zoom.pinching = true;
    if (zoom.pinching) {
      zoom.scale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom.startScale * distRatio));
      zoom.panX += mx - touch.lastX; zoom.panY += my - touch.lastY;
      clampPan(); applyZoom();
    } else {
      if (state.inputMode === 'touch' && !touch.scrollPrimed) {
        touch.scrollPrimed = true;
        sendMoveAbs(videoToNorm(touch.startX, touch.startY));
      }
      scrollFeed(mx - touch.lastX, -(my - touch.lastY));
      touch.didScroll = true;
    }
    touch.moved = true;
    touch.lastX = mx; touch.lastY = my;
    return;
  }

  if (e.touches.length !== 1) return;

  const t = e.touches[0];
  const dx = t.clientX - touch.lastX;
  const dy = t.clientY - touch.lastY;
  touch.lastX = t.clientX;
  touch.lastY = t.clientY;
  const dist = Math.hypot(t.clientX - touch.startX, t.clientY - touch.startY);
  if (dist > TAP_MAX_MOVE) touch.moved = true;

  if (touch.dragging) { dragTo(t.clientX, t.clientY); return; }

  if (state.inputMode === 'touch') {
    if (touch.longPressed) {
      if (dist > DRAG_START_MOVE) { startDrag(); dragTo(t.clientX, t.clientY); }
      return;
    }
    if (dx === 0 && dy === 0) return;
    if (!state.scrollMode && isZoomed()) {
      zoom.panX += dx; zoom.panY += dy;
      clampPan(); applyZoom();
      return;
    }
    // Put the pointer under the finger first, so the scroll reaches the window
    // the user is actually looking at rather than wherever the cursor was left.
    if (!touch.scrollPrimed) {
      touch.scrollPrimed = true;
      sendMoveAbs(videoToNorm(touch.startX, touch.startY));
    }
    scrollFeed(dx, -dy);
    touch.didScroll = true;
    return;
  }

  // Trackpad mode
  if (state.scrollMode) {
    scrollFeed(dx, -dy);
    touch.didScroll = true;
    return;
  }
  if (dx === 0 && dy === 0) return;
  if (isZoomed()) {
    zoom.panX += dx; zoom.panY += dy;
    clampPan(); applyZoom();
  } else {
    dcSend({ t: 'move', dx: Math.round(dx), dy: Math.round(dy) });
  }
}, { passive: false });

videoWrap.addEventListener('touchend', e => {
  if (!state.connected) return;
  e.preventDefault();
  clearTimeout(touch.longPressTimer);

  const allUp = e.touches.length === 0;
  const ct = e.changedTouches[0];

  if (touch.dragging) {
    endDrag(ct?.clientX, ct?.clientY);
    if (allUp) { zoom.pinching = false; touch.longPressed = false; }
    return;
  }

  const elapsed = Date.now() - touch.startTime;
  // A press that already turned into a long press is never also a tap, whatever
  // the clock says.
  const wasHold = !touch.moved && touch.longPressed;
  const wasTap  = !touch.moved && !touch.longPressed && elapsed < LONG_PRESS_MS;

  if (zoom.scale < 1.05) resetZoom();
  if (touch.didScroll && !zoom.pinching && allUp) scrollMomentumStart();

  if (e.changedTouches.length === 1 && allUp && ct) {
    if (state.inputMode === 'touch') {
      if (wasHold) {
        sendMoveAbs(videoToNorm(touch.startX, touch.startY));
        dcSend({ t: 'click', button: 'right' });
        showCursorRipple();
      } else if (wasTap) {
        scrollReset();
        sendMoveAbs(videoToNorm(ct.clientX, ct.clientY));
        const now = Date.now();
        const near = Math.hypot(ct.clientX - touch.lastTapX, ct.clientY - touch.lastTapY) < DTAP_MAX_MOVE;
        const isDoubleTap = near && (now - touch.lastTapTime) < DTAP_INTERVAL;
        touch.lastTapTime = isDoubleTap ? 0 : now;
        touch.lastTapX = ct.clientX;
        touch.lastTapY = ct.clientY;
        if (isDoubleTap) {
          dcSend({ t: 'dblclick', button: 'left' });
        } else if (state.nextRightClick) {
          dcSend({ t: 'click', button: 'right' });
          clearRightClickArm();
        } else {
          dcSend({ t: 'click', button: 'left' });
        }
        showCursorRipple();
      }
    } else if (wasTap) {
      scrollReset();
      const now = Date.now();
      const isDoubleTap = (now - touch.lastTapTime) < DTAP_INTERVAL;
      touch.lastTapTime = now;
      if (isDoubleTap) {
        if (isZoomed()) { resetZoom(); }
        else {
          zoom.scale = 2.5;
          const r = videoWrap.getBoundingClientRect();
          const cx = ct.clientX - r.left - r.width / 2;
          const cy = ct.clientY - r.top - r.height / 2;
          zoom.panX = -cx * (zoom.scale - 1);
          zoom.panY = -cy * (zoom.scale - 1);
          clampPan(); applyZoom();
        }
        touch.lastTapTime = 0;
      } else if (state.nextRightClick) {
        dcSend({ t: 'click', button: 'right' });
        showCursorRipple();
        clearRightClickArm();
      } else {
        dcSend({ t: 'click', button: 'left' });
        showCursorRipple();
      }
    }
  }

  if (allUp && e.changedTouches.length === 2 && !touch.moved && !zoom.pinching) {
    if (state.inputMode === 'touch') sendMoveAbs(videoToNorm(touch.startX, touch.startY));
    dcSend({ t: 'click', button: 'right' });
    showCursorRipple();
  }
  if (allUp) { zoom.pinching = false; touch.longPressed = false; }
}, { passive: false });

// A finger leaving the surface (system gesture, incoming call) must not leave
// the remote mouse button stuck down.
videoWrap.addEventListener('touchcancel', () => {
  clearTimeout(touch.longPressTimer);
  endDrag();
  touch.longPressed = false;
  zoom.pinching = false;
}, { passive: true });

// ── Desktop keyboard ──────────────────────────────────────────────────────────
const KEY_MAP = {
  'Enter': 'enter', 'Backspace': 'backspace', 'Delete': 'delete',
  'Escape': 'escape', 'Tab': 'tab', 'ArrowUp': 'up', 'ArrowDown': 'down',
  'ArrowLeft': 'left', 'ArrowRight': 'right', 'Home': 'home', 'End': 'end',
  'PageUp': 'pageup', 'PageDown': 'pagedown', 'F1': 'f1', 'F2': 'f2',
  'F3': 'f3', 'F4': 'f4', 'F5': 'f5', 'F6': 'f6', 'F7': 'f7', 'F8': 'f8',
  'F9': 'f9', 'F10': 'f10', 'F11': 'f11', 'F12': 'f12',
};

document.addEventListener('keydown', e => {
  if (!state.connected) return;
  if (e.target === hostInput || e.target === passwordInput || e.target === connectBtn) return;
  const mods = [];
  if (e.metaKey) mods.push('cmd');
  if (e.ctrlKey) mods.push('ctrl');
  if (e.altKey)  mods.push('alt');
  if (e.shiftKey) mods.push('shift');
  const mapped = KEY_MAP[e.key];
  if (mapped) { e.preventDefault(); dcSend({ t: 'key', key: mapped, mods }); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { e.preventDefault(); dcSend({ t: 'type', text: e.key }); return; }
  if (e.key.length === 1 && mods.length > 0) { e.preventDefault(); dcSend({ t: 'key', key: e.key.toLowerCase(), mods }); }
});

// ── Mobile keyboard via hidden textarea ───────────────────────────────────────
let lastKbValue = '';
const keyBar = $('keyBar');
const kbDismissBtn = $('kbDismissBtn');
const app = $('app');

function showKb() {
  kbCapture.value = ' ';
  lastKbValue = ' ';
  kbCapture.focus();
  btnKb.classList.add('active');
  keyBar.classList.add('visible');
  showToast('Keyboard active');
}

function hideKb() {
  kbCapture.blur();
  btnKb.classList.remove('active');
  keyBar.classList.remove('visible');
  app.classList.remove('kb-open');
  document.documentElement.style.height = '';
  // Clear held modifiers
  heldMods.clear();
  keyBar.querySelectorAll('.kbMod.held').forEach(b => b.classList.remove('held'));
}

btnKb.addEventListener('click', () => {
  if (document.activeElement === kbCapture) { hideKb(); return; }
  showKb();
});

kbCapture.addEventListener('input', () => {
  const val = kbCapture.value;
  if (val.length > lastKbValue.length) {
    const added = val.slice(lastKbValue.length);
    if (added) {
      const mods = [...heldMods];
      if (mods.length > 0) {
        // Type with modifiers = send as key tap per character
        for (const ch of added) dcSend({ t: 'key', key: ch, mods });
        releaseAllMods();
      } else {
        dcSend({ t: 'type', text: added });
      }
    }
  } else if (val.length < lastKbValue.length) {
    const count = lastKbValue.length - val.length;
    for (let i = 0; i < count; i++) dcSend({ t: 'key', key: 'backspace', mods: [] });
  }
  lastKbValue = val;
  if (val.length < 3) { kbCapture.value = '   '; lastKbValue = kbCapture.value; }
});

kbCapture.addEventListener('keydown', e => {
  if (!state.connected) return;
  const mapped = KEY_MAP[e.key];
  if (mapped && mapped !== 'backspace') { e.preventDefault(); dcSend({ t: 'key', key: mapped, mods: [] }); }
});

// Use a flag so blur from tapping keyBar buttons is suppressed.
let keyBarTouching = false;
let blurTimer = null;

kbCapture.addEventListener('blur', () => {
  // Delay blur handling — if a keyBar button was tapped, we'll cancel this.
  blurTimer = setTimeout(() => {
    if (keyBarTouching) return; // tap in progress, don't dismiss
    btnKb.classList.remove('active');
    keyBar.classList.remove('visible');
    app.classList.remove('kb-open');
    document.documentElement.style.height = '';
    heldMods.clear();
    keyBar.querySelectorAll('.kbMod.held').forEach(b => b.classList.remove('held'));
  }, 80);
});

// ── Clipboard bridge ─────────────────────────────────────────────────────────
// Going through the Mac's own clipboard survives emoji, newlines and long text
// that replaying keystrokes one character at a time mangles.
async function pasteToMac() {
  if (!state.connected) return;
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch {
    showToast('Your browser blocked clipboard access', 3000);
    return;
  }
  if (!text) { showToast('Nothing on the phone clipboard'); return; }
  dcSend({ t: 'clipset', text });
  dcSend({ t: 'key', key: 'v', mods: ['cmd'] });
  showToast('Pasted into the Mac');
}

// Safari only allows a clipboard write inside the gesture that asked for it, and
// the Mac's answer arrives a round trip later — so a blocked write is held for
// the next tap, which is a gesture again.
let pendingClip = null;

function copyFromMac() {
  if (!state.connected) return;
  if (pendingClip !== null) {
    const text = pendingClip;
    pendingClip = null;
    navigator.clipboard.writeText(text)
      .then(() => showToast('Copied from the Mac'))
      .catch(() => showToast('Your browser blocked clipboard access', 3000));
    return;
  }
  dcSend({ t: 'clipget' });
}

async function receiveClip(text) {
  if (!text) { showToast('Nothing on the Mac clipboard'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Copied from the Mac');
  } catch {
    pendingClip = text;
    showToast('Tap Copy once more to save it', 4000);
  }
}

// ── Accessory key bar (arrows, special keys, modifiers) ──────────────────────
const heldMods = new Set();

function releaseAllMods() {
  heldMods.clear();
  keyBar.querySelectorAll('.kbMod.held').forEach(b => b.classList.remove('held'));
}

function handleKeyBarBtn(btn) {
  // Dismiss button
  if (btn === kbDismissBtn) { hideKb(); return; }

  const act = btn.dataset.act;
  if (act === 'paste') { pasteToMac(); return; }
  if (act === 'copy')  { copyFromMac(); return; }

  // Modifier toggle (sticky)
  const mod = btn.dataset.mod;
  if (mod) {
    if (heldMods.has(mod)) {
      heldMods.delete(mod);
      btn.classList.remove('held');
    } else {
      heldMods.add(mod);
      btn.classList.add('held');
    }
    return;
  }

  // Regular key
  const key = btn.dataset.key;
  if (key) {
    const mods = [...heldMods];
    dcSend({ t: 'key', key, mods });
    if (heldMods.size > 0) releaseAllMods();
  }
}

// Track keyBar touches: set flag to suppress blur, detect scroll vs tap.
let keyBarScrolling = false;
let keyBarTouchStartX = 0;

keyBar.addEventListener('touchstart', e => {
  keyBarTouching = true;
  keyBarScrolling = false;
  keyBarTouchStartX = e.touches[0].clientX;
  clearTimeout(blurTimer); // cancel any pending blur
}, { passive: true });

keyBar.addEventListener('touchmove', e => {
  const dx = Math.abs(e.touches[0].clientX - keyBarTouchStartX);
  if (dx > 8) keyBarScrolling = true;
}, { passive: true });

keyBar.addEventListener('touchend', e => {
  keyBarTouching = false;
  if (!keyBarScrolling) {
    const btn = e.target.closest('.kbKey');
    if (btn) handleKeyBarBtn(btn);
  }
  // Re-focus the textarea to keep soft keyboard open
  kbCapture.focus();
}, { passive: true });

// ── Viewport resize: detect soft keyboard open/close ─────────────────────────
if (window.visualViewport) {
  let initialHeight = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', () => {
    const vv = window.visualViewport;
    const kbHeight = initialHeight - vv.height;
    if (kbHeight > 100 && document.activeElement === kbCapture) {
      app.classList.add('kb-open');
      // Shrink the entire page to fit above the keyboard
      document.documentElement.style.height = vv.height + 'px';
    } else {
      app.classList.remove('kb-open');
      document.documentElement.style.height = '';
    }
  });
  // Update baseline on orientation change
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { initialHeight = window.visualViewport.height; }, 200);
  });
}

// ── Shortcut sheet ───────────────────────────────────────────────────────────
// Everything a phone cannot type: the macOS chords that need a physical keyboard.
const SHORTCUTS = [
  { name: 'Spotlight',    combo: '⌘ Space', key: 'space',  mods: ['cmd'] },
  { name: 'Switch app',   combo: '⌘ Tab',   key: 'tab',    mods: ['cmd'] },
  { name: 'Mission Ctrl', combo: '⌃ ↑',     key: 'up',     mods: ['ctrl'] },
  { name: 'Copy',         combo: '⌘ C',     key: 'c',      mods: ['cmd'] },
  { name: 'Paste',        combo: '⌘ V',     key: 'v',      mods: ['cmd'] },
  { name: 'Cut',          combo: '⌘ X',     key: 'x',      mods: ['cmd'] },
  { name: 'Undo',         combo: '⌘ Z',     key: 'z',      mods: ['cmd'] },
  { name: 'Select all',   combo: '⌘ A',     key: 'a',      mods: ['cmd'] },
  { name: 'Save',         combo: '⌘ S',     key: 's',      mods: ['cmd'] },
  { name: 'Find',         combo: '⌘ F',     key: 'f',      mods: ['cmd'] },
  { name: 'Close window', combo: '⌘ W',     key: 'w',      mods: ['cmd'] },
  { name: 'Quit app',     combo: '⌘ Q',     key: 'q',      mods: ['cmd'] },
  { name: 'Screenshot',   combo: '⌘⇧ 4',    key: '4',      mods: ['cmd', 'shift'] },
  { name: 'Force quit',   combo: '⌘⌥ Esc',  key: 'escape', mods: ['cmd', 'alt'] },
];

const sheet = $('sheet');
const sheetScrim = $('sheetScrim');
const btnMore = $('btnMore');
const sheetRightClick = $('sheetRightClick');
const sheetHud = $('sheetHud');
const hud = $('hud');

for (const sc of SHORTCUTS) {
  const b = document.createElement('button');
  b.className = 'sheetBtn';
  b.innerHTML = `${sc.name}<span class="combo"></span>`;
  b.querySelector('.combo').textContent = sc.combo;
  b.addEventListener('click', () => {
    if (!state.connected) return;
    dcSend({ t: 'key', key: sc.key, mods: sc.mods });
    showToast(sc.name);
    closeSheet();
  });
  $('shortcutGrid').appendChild(b);
}

function openSheet() {
  syncSheet();
  sheet.classList.add('open');
  sheetScrim.classList.add('open');
  btnMore.classList.add('active');
}

function closeSheet() {
  sheet.classList.remove('open');
  sheetScrim.classList.remove('open');
  btnMore.classList.toggle('active', state.nextRightClick || state.showStats);
}

function syncSheet() {
  sheetRightClick.classList.toggle('active', state.nextRightClick);
  sheetHud.classList.toggle('active', state.showStats);
  if (!sheet.classList.contains('open')) {
    btnMore.classList.toggle('active', state.nextRightClick || state.showStats);
  }
}

// Called once the armed right click has been spent.
function clearRightClickArm() {
  state.nextRightClick = false;
  syncSheet();
}

btnMore.addEventListener('click', () => {
  sheet.classList.contains('open') ? closeSheet() : openSheet();
});
sheetScrim.addEventListener('click', closeSheet);

sheetRightClick.addEventListener('click', () => {
  state.nextRightClick = !state.nextRightClick;
  syncSheet();
  showToast(state.nextRightClick ? 'Next tap right-clicks' : 'Right click off');
  if (state.nextRightClick) closeSheet();
});

sheetHud.addEventListener('click', () => {
  state.showStats = !state.showStats;
  localStorage.setItem(HUD_KEY, state.showStats ? '1' : '0');
  hud.classList.toggle('visible', state.showStats);
  if (!state.showStats) hud.textContent = '';
  syncSheet();
});

for (const b of sheet.querySelectorAll('.sheetBtn[data-act]')) {
  b.addEventListener('click', () => {
    if (b.dataset.act === 'paste') pasteToMac(); else copyFromMac();
    closeSheet();
  });
}

// ── Stats HUD ────────────────────────────────────────────────────────────────
function renderHud(s) {
  if (!state.showStats) return;
  hud.innerHTML = '';
  for (const [k, v] of Object.entries(s)) {
    const row = document.createElement('div');
    row.innerHTML = `${k} <b></b>`;
    row.querySelector('b').textContent = v;
    hud.appendChild(row);
  }
}

// ── Toolbar buttons ───────────────────────────────────────────────────────────
btnMode.addEventListener('click', () => {
  state.inputMode = state.inputMode === 'touch' ? 'trackpad' : 'touch';
  localStorage.setItem(MODE_KEY, state.inputMode);
  modeLabel.textContent = state.inputMode === 'touch' ? 'Touch' : 'Pad';
  btnMode.classList.toggle('active', state.inputMode === 'touch');
  endDrag();
  showToast(state.inputMode === 'touch'
    ? 'Touch — tap to click, hold then drag'
    : 'Trackpad — swipe to move the pointer', 2600);
});

btnFit.addEventListener('click', () => {
  state.fitMode = effectiveFit() === 'fill' ? 'fit' : 'fill';
  localStorage.setItem(FIT_KEY, state.fitMode);
  fitRetriesLeft = 20;   // in case it is tapped before the first frame
  applyFit();
  showToast(state.fitMode === 'fill' ? 'Filling the screen — drag to pan' : 'Whole screen');
});

btnQuality.addEventListener('click', () => {
  const i = QUALITY_PRESETS.findIndex(q => q.id === state.quality);
  state.quality = QUALITY_PRESETS[(i + 1) % QUALITY_PRESETS.length].id;
  localStorage.setItem(QUALITY_KEY, state.quality);
  state.autoAdapt = false;   // stop second-guessing a deliberate choice
  updateQualityChip();
  if (state.connected) {
    sendQuality();
    showToast(`Quality: ${currentQuality().label} — restarting the stream`, 2500);
  } else {
    showToast(`Quality: ${currentQuality().label}`);
  }
});

btnScroll.addEventListener('click', () => {
  state.scrollMode = !state.scrollMode;
  btnScroll.classList.toggle('active', state.scrollMode);
});

btnFullscreen.addEventListener('click', async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen?.().catch(() => {});
    return;
  }
  if (document.documentElement.requestFullscreen) {
    await document.documentElement.requestFullscreen().catch(() => {});
    // Only allowed in fullscreen, and unsupported on iOS \u2014 failure is expected.
    try { await window.screen?.orientation?.lock?.('landscape'); } catch {}
    return;
  }
  // iPhone Safari has no Fullscreen API for ordinary elements. The video element
  // does have one, but it hands the picture to the native player and swallows
  // every touch \u2014 useless for a remote desktop. Installing to the home screen is
  // the real route to a chrome-less window.
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  showToast(standalone
    ? 'Already running as an app'
    : 'Tap Share \u2192 Add to Home Screen for fullscreen', 4500);
});

btnDisconnect.addEventListener('click', () => {
  disconnect();
  setStatus('Not connected', '');
  overlay.style.display = 'flex';
  placeholder.style.display = 'flex';
  connectBtn.disabled = false;
});

// ── Connect form ──────────────────────────────────────────────────────────────
function parseHost(raw) {
  try {
    if (raw.includes('://')) return new URL(raw).host;
    return raw.replace(/\/+$/, '');
  } catch { return raw; }
}

async function handleConnect() {
  const raw = hostInput.value.trim();
  if (!raw) { showError('Please enter an address.'); return; }
  const pw = passwordInput.value;
  if (!pw) { showError('Password required.'); return; }
  const host = parseHost(raw);
  hostInput.value = host;
  localStorage.setItem('macagent_host', host);
  sessionStorage.setItem('macagent_pw', pw);
  await connect(host, pw);
}

connectBtn.addEventListener('click', handleConnect);
hostInput.addEventListener('keydown', e => { if (e.key === 'Enter') passwordInput.focus(); });
passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleConnect(); });

// ── Keep the picture fitted ──────────────────────────────────────────────────
// The fill scale depends on both the video's own size and the viewport, so it is
// recomputed whenever either changes — including when the Mac's resolution does.
// Which of these actually carries the first known dimensions varies by browser,
// and Safari is the awkward one — so listen to all of them and let applyFit be
// idempotent.
for (const ev of ['loadedmetadata', 'loadeddata', 'canplay', 'playing', 'resize']) {
  screenEl.addEventListener(ev, () => applyFit(false));
}

let refitTimer = null;
function scheduleRefit() {
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => applyFit(true), 150);
}
window.addEventListener('resize', scheduleRefit);
window.addEventListener('orientationchange', scheduleRefit);
window.screen?.orientation?.addEventListener?.('change', scheduleRefit);

// ── Install as an app ────────────────────────────────────────────────────────
// Standalone mode is the practical answer to iOS having no Fullscreen API for
// anything but <video>: added to the home screen, the client runs without Safari's
// chrome and gets the whole display.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ── Fullscreen change ─────────────────────────────────────────────────────────
document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  btnFullscreen.querySelector('svg').innerHTML = isFs
    ? '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3"/>'
    : '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
});
</script>
</body>
